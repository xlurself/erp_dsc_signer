[project]
name = "erp-dsc-local"
version = "0.1.0"
description = "Loopback USB DSC signing service for ERP DSC Signer"
requires-python = ">=3.10"
# attrs: endesive imports ``attr`` for the signature appearance (PyPDF2_annotate) but does not
# declare it; the ERP's signature_meta always carries signature_appearance, so without attrs
# every ERP signing fails inside cms.sign (ModuleNotFoundError: No module named 'attr').
# cryptography>=42: endesive.pdf imports cryptography.x509.verification, absent in 41.
dependencies = ["PyKCS11>=1.5.12", "endesive>=2.19.0,<3", "cryptography>=42", "attrs>=22"]

[project.scripts]
erp-dsc-local = "erp_dsc_local.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
