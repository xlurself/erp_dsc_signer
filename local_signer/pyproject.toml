[project]
name = "erp-dsc-local"
version = "0.1.0"
description = "Loopback USB DSC signing service for ERP DSC Signer"
requires-python = ">=3.10"
dependencies = ["PyKCS11>=1.5.12", "endesive>=2.19.0,<3", "cryptography>=41"]

[project.scripts]
erp-dsc-local = "erp_dsc_local.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
