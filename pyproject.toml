[project]
name = "erp_dsc_signer"
authors = [
    { name = "XLURSELF", email = "info@xlurself.com"}
]
description = "Digital signing for ERPNext documents using PFX certificates or USB DSC tokens"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=15.0.0" # Installed and managed by bench.
    "endesive>=2.19.0,<3",
    "pypdf>=3.0.0",
    # endesive's vendored PyPDF2_annotate imports attr without declaring it.
    "attrs>=22.0.0",
    # F2: ca_trust uses cryptography.x509.verification (PolicyBuilder/Store) and x509.ocsp.
    "cryptography>=42.0.0",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# Frappe versions this app supports. Required by Frappe Cloud and used by
# `bench validate-dependencies`. Parsed as a semantic_version SimpleSpec.
[tool.bench.frappe-dependencies]
frappe = ">=14.0.0,<16.0.0"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"
